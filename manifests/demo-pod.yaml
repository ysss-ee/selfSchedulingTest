apiVersion: v1
kind: Pod
metadata:
  name: self-scheduler-demo
  labels:
    app: self-scheduler-demo
spec:
  schedulerName: self-scheduler
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
