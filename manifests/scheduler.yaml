apiVersion: v1
kind: Namespace
metadata:
  name: self-scheduler-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-scheduler
  namespace: self-scheduler-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-scheduler-as-kube-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: self-scheduler
    namespace: self-scheduler-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: self-scheduler-config
  namespace: self-scheduler-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: self-scheduler
        plugins:
          filter:
            enabled:
              - name: NodeLabel
          score:
            enabled:
              - name: NodeLabel
                weight: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-scheduler
  namespace: self-scheduler-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-scheduler
  template:
    metadata:
      labels:
        app: self-scheduler
    spec:
      serviceAccountName: self-scheduler
      containers:
        - name: scheduler
          image: example/self-scheduler:v1.36.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/kubernetes/scheduler-config.yaml
          volumeMounts:
            - name: scheduler-config
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: self-scheduler-config
